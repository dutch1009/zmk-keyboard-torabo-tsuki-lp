include:
  # Physical HIRES_DIAL is attached to the left split peripheral.
  - board: bmp_boost
    shield: torabo_tsuki_lp_left
    snippet: input-hires-dial-peripheral
    artifact-name: torabo_tsuki_lp_hires_dial_left_peripheral
    cmake-args: "-DCMAKE_PROJECT_INCLUDE=/tmp/zmk-config/config/cmake/force-c11-feature.cmake"

  # Studio RPC, runtime sensor rotation, and BLE management run on the right central.
  - board: bmp_boost
    shield: torabo_tsuki_lp_right
    snippet: "studio-rpc-usb-uart split-central input-trackball input-listener split-input-hires-dial"
    artifact-name: torabo_tsuki_lp_hires_dial_right_central
    cmake-args: "-DCMAKE_PROJECT_INCLUDE=/tmp/zmk-config/config/cmake/force-c11-feature.cmake"
