# Enable the physical HIRES_DIAL and its scroll behavior on the left peripheral.
CONFIG_ZMK_HIRES_DIAL=y
CONFIG_ZMK_HIRES_DIAL_SCROLL=y

# The left half hosts the physical dial and is the split peripheral.
# These options are only valid on the central half.
CONFIG_ZMK_USB=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=n

# Runtime sensor rotation and its Studio RPC run on the central half only.
# ZMK's behavior queue is built only for the split central role, so the
# runtime sensor rotate behavior must not be compiled into the peripheral.
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=n
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=n

CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=n
